<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pulse Cathedral — BioViz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <video id="webcam" autoplay playsinline></video>
  <canvas id="face-canvas"></canvas>

  <div id="hud">
    <div id="hud-top">
      <div id="signal-quality">
        <span class="hud-label">Signal</span>
        <div id="signal-bar"><div id="signal-fill"></div></div>
        <span id="quality-text" class="hud-value-sm">0%</span>
      </div>
    </div>

    <div id="hud-bottom">
      <div id="hr-display">
        <span id="pulse-dot"></span>
        <span id="hr-value">--</span>
        <span class="hud-unit">BPM</span>
      </div>
      <div id="hud-stats">
        <div class="hud-stat">
          <span class="hud-label">HRV</span>
          <span id="hrv-value">--</span>
          <span class="hud-unit">ms</span>
        </div>
        <div class="hud-stat">
          <span class="hud-label">Coherence</span>
          <span id="coherence-value">--</span>
          <div id="coherence-bar"><div id="coherence-fill"></div></div>
        </div>
      </div>
      <canvas id="sparkline" width="200" height="40"></canvas>
    </div>
  </div>

  <div id="breathing-guide">
    <div id="breathing-circle"></div>
    <span id="breathing-label">Breathe In</span>
    <span id="breathing-timer">4</span>
  </div>

  <div id="tap-overlay">
    <p id="tap-message">Tap to Begin</p>
  </div>

  <div id="status-overlay" class="hidden">
    <p id="status-message">Initializing camera…</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
